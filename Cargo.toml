[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jarvis-jhk/bopl-port"

[workspace.dependencies]
unity-assets = { path = "crates/unity" }
bopl-import = { path = "crates/import" }
bopl-render = { path = "crates/render" }
bopl-net = { path = "crates/net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
glam = { version = "0.30", features = ["serde"] }
memmap2 = "0.9"
bcdec_rs = "0.2"
rayon = "1"
tiny-skia = "0.11"
png = "0.18"
lewton = "0.10"
# Platform + renderer (crates/render, crates/game).
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal", "gles", "parking_lot"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
pollster = "1"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
raw-window-handle = "0.6"

# bopl-net (online play): GGRS rollback over Warpzone peer channels; warpzone-core
# pinned to the commit checked out in ext/warpzone.
ggrs = "0.13"
bincode = "1.3"
warpzone-core = { git = "https://github.com/jarvis-jhk/warpzone", rev = "c967f5c1b2f7c41ff66d4c16e7b4197440beee8b" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
